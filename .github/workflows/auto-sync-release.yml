name: Auto Sync & Release

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build and release even if already up to date'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Check latest upstream release and merge if newer
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LATEST_TAG=$(curl -fsSL https://api.github.com/repos/rustdesk/rustdesk/releases/latest | jq -r '.tag_name')
          echo "Latest upstream release tag: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "Failed to fetch latest tag"
            exit 1
          fi

          git remote add upstream https://github.com/rustdesk/rustdesk.git || true
          git fetch upstream "refs/tags/$LATEST_TAG:refs/tags/$LATEST_TAG"

          IS_NEWER=false
          if ! gh release view "$LATEST_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            IS_NEWER=true
          fi

          if ! git merge-base --is-ancestor "refs/tags/$LATEST_TAG" HEAD; then
            IS_NEWER=true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git merge -X ours --no-edit "refs/tags/$LATEST_TAG"
            git push origin master
          fi

          if [ "$IS_NEWER" = "true" ] || [ "${{ inputs.force_build }}" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-and-sync
    if: needs.check-and-sync.outputs.should_build == 'true'
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
    secrets: inherit

  publish-release:
    needs: [check-and-sync, build]
    if: needs.check-and-sync.outputs.should_build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect macOS ARM64 and Windows x64 installers
        id: collect
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( \
            -iname '*aarch64*.dmg' -o \
            -iname '*arm64*.dmg' -o \
            -iname '*x86_64*.exe' -o \
            -iname '*x86_64*.msi' -o \
            -iname '*x64*.exe' -o \
            -iname '*x64*.msi' \
          \) -exec cp -v {} release-assets/ \;
          ls -la release-assets/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-and-sync.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$(ls -A release-assets)" ]; then
            echo "No macOS ARM64 or Windows x64 installer artifacts found!"
            exit 1
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" release-assets/* \
              --repo "${{ github.repository }}" \
              --target master \
              --title "RustDesk $TAG" \
              --notes "Automated build synced from upstream rustdesk/rustdesk $TAG."
          fi
